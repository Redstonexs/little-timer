name: Build portable Windows timer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-i686
      - name: Test timer and audio with sanitizers
        run: bash scripts/test.sh
      - name: Build standalone x86 executable
        run: bash scripts/build-mingw.sh --qa
      - name: Verify portable PE packaging
        run: python3 scripts/verify-pe.py dist/LittleTimer.exe --report build/pe-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: LittleTimer-portable-win32
          path: |
            dist/LittleTimer.exe
            README.md
            LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: native-test-tools
          path: |
            build/LittleTimerQA.exe
            build/timer_tests.exe
            build/pe-report.json

  windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-test-tools
          path: build
      - name: Verify native Win32 controls and render screenshots
        shell: powershell
        run: >-
          .\scripts\verify-windows.ps1
          -Executable "$pwd\build\LittleTimerQA.exe"
          -OutputDirectory "$pwd\build\windows-qa"
          -CoreTests "$pwd\build\timer_tests.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: build/windows-qa
